<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinkup</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10131f;
        color: #cfd6ff;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
      }

      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }

      p {
        color: #9aa4d6;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        padding: 12px 16px;
        border: 1px solid #394365;
        border-radius: 8px;
        cursor: pointer;
      }

      input {
        width: 18px;
        height: 18px;
        accent-color: #7d93ff;
      }

      #confirmation {
        min-height: 1.5em;
        color: #a7efc0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vinkup</h1>
      <p>This display is reserved while your session is active.</p>
      <label>
        <input id="interaction-test" type="checkbox" />
        Test that this screen is interactive
      </label>
      <p id="confirmation" aria-live="polite"></p>
    </main>
    <script>
      const checkbox = document.getElementById('interaction-test');
      const confirmation = document.getElementById('confirmation');

      checkbox.addEventListener('change', () => {
        confirmation.textContent = checkbox.checked ? 'Interaction confirmed.' : '';
      });
    </script>
  </body>
</html>

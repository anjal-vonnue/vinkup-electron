<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinkup</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: light;
        --background: #f5f6fa;
        --surface: #ffffff;
        --panel: #f0f1f5;
        --text: #14162a;
        --text-secondary: #5b5d6e;
        --border: #e4e5ec;
        --accent: #6941c6;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #10131f;
        --surface: #181b28;
        --panel: #121420;
        --text: #e0e1f4;
        --text-secondary: #958ea0;
        --border: #2a2d3e;
        --accent: #b19aff;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 72px;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
      }

      nav {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      button {
        font: inherit;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 150ms ease,
          color 150ms ease,
          border-color 150ms ease;
      }

      .tab:hover {
        color: var(--text);
      }

      .tab:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .tab:disabled:hover {
        color: var(--text-secondary);
      }

      .tab[aria-selected='true'] {
        background: var(--surface);
        border-color: var(--border);
        color: var(--accent);
        font-weight: 600;
      }

      .tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      #resources-panel {
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 32px;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(1.35rem, 3vw, 2rem);
        line-height: 1.3;
      }

      p {
        margin: 0 0 16px;
        color: var(--text-secondary);
        line-height: 1.7;
      }

      [hidden] {
        display: none !important;
      }

      .reference-list-view {
        width: min(100% - 48px, 1120px);
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .list-heading {
        margin-bottom: 22px;
      }

      .list-heading p {
        margin: 8px 0 0;
      }

      .reference-search {
        width: min(100%, 440px);
        min-height: 42px;
        margin: 0 0 32px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      .reference-search:focus-visible,
      .reference-card:focus-visible,
      .reader-toolbar button:focus-visible,
      .reader-footer button:focus-visible,
      .prerequisite-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .reference-group + .reference-group {
        margin-top: 30px;
      }

      .group-title {
        margin: 0 0 12px;
        color: var(--text);
        font-size: 1.1rem;
      }

      .reference-group-items {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
        gap: 12px;
      }

      .reference-card {
        display: flex;
        min-height: 76px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 6px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 150ms ease,
          transform 150ms ease,
          background-color 150ms ease;
      }

      .reference-card:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }

      .reference-card-title {
        font-weight: 650;
        line-height: 1.4;
      }

      .reference-card-day {
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .reference-card-meta,
      .empty-state {
        color: var(--text-secondary);
        font-size: 0.875rem;
      }

      .reader-toolbar {
        position: sticky;
        z-index: 3;
        top: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 14px max(24px, calc((100% - 1120px) / 2));
        border-bottom: 1px solid var(--border);
        background: var(--background);
      }

      .reader-toolbar h1 {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        overflow: hidden;
      }

      .reader-day-indicator {
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 650;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .reader-reference-title {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reader-toolbar-actions,
      .reader-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .reader-button,
      .prerequisite-button {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        padding: 0 13px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .reader-button:hover:not(:disabled),
      .prerequisite-button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .reader-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .reader-content {
        width: min(100% - 48px, 920px);
        margin: 26px auto 0;
        padding: 28px clamp(18px, 4vw, 48px);
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }

      .reference-section + .reference-section,
      .video-section,
      .prerequisites {
        margin-top: 42px;
      }

      .section-title {
        margin: 0 0 18px;
        color: var(--text);
        font-size: clamp(1.1rem, 2.4vw, 1.4rem);
        line-height: 1.4;
      }

      .paragraph,
      .definition-description,
      .content-list,
      .instruction {
        color: var(--text-secondary);
        line-height: 1.75;
      }

      .inline-code {
        padding: 0.1em 0.35em;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
        font:
          0.9em ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }

      .subheading {
        margin: 28px 0 12px;
        color: var(--text);
        font-size: 1.05rem;
      }

      .content-list {
        padding-left: 24px;
      }

      .content-list li + li {
        margin-top: 6px;
      }

      .definitions {
        margin: 22px 0;
      }

      .definition-item + .definition-item {
        margin-top: 18px;
      }

      .definition-term {
        margin-bottom: 5px;
        color: var(--text);
        font-weight: 650;
      }

      .definition-description {
        margin: 0;
      }

      .table-wrapper,
      .html-table {
        max-width: 100%;
        margin: 22px 0;
        overflow-x: auto;
      }

      .content-table {
        width: 100%;
        border-collapse: collapse;
        color: var(--text-secondary);
      }

      .content-table th,
      .content-table td,
      .html-table th,
      .html-table td {
        padding: 10px 12px;
        border: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
        line-height: 1.6;
      }

      .content-table th,
      .html-table th {
        background: var(--panel);
        color: var(--text);
      }

      .code-block {
        margin: 22px 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--background);
      }

      .code-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 13px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        color: var(--text-secondary);
        font-size: 0.78rem;
      }

      .code-pre {
        max-width: 100%;
        margin: 0;
        padding: 16px;
        overflow-x: auto;
        color: var(--text);
        font:
          0.86rem/1.65 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        tab-size: 2;
      }

      .image-figure {
        margin: 22px 0;
      }

      .content-image {
        display: block;
        max-width: 100%;
        max-height: 560px;
        margin: 0 auto;
        object-fit: contain;
      }

      .image-caption {
        margin-top: 8px;
        color: var(--text-secondary);
        font-size: 0.85rem;
        text-align: center;
      }

      .callout,
      .instruction {
        margin: 18px 0;
        padding: 15px 18px;
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        background: var(--panel);
      }

      .callout.warning {
        border-left-color: #d97706;
      }

      .callout-title {
        display: block;
        margin-bottom: 6px;
        color: var(--text);
      }

      .callout .paragraph {
        margin: 0;
      }

      .topic-accordion {
        margin: 12px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .accordion-summary {
        padding: 12px 14px;
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }

      .topic-accordion > :not(summary) {
        margin-right: 14px;
        margin-left: 14px;
      }

      .video-card {
        margin: 18px 0;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--background);
      }

      .video-title {
        margin: 0 0 12px;
        color: var(--text);
        font-size: 1rem;
      }

      .video-frame {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        border-radius: 6px;
        background: #000;
      }

      .prerequisite-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .reader-footer {
        width: min(100% - 48px, 920px);
        margin: 16px auto 40px;
      }

      @media (max-width: 480px) {
        header {
          min-height: 64px;
          padding: 0 12px;
        }

        nav {
          width: 100%;
        }

        .tab {
          flex: 1;
          gap: 6px;
          padding: 0 10px;
        }

        .reference-list-view {
          width: calc(100% - 28px);
          padding-top: 20px;
        }

        .reader-toolbar {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 10px;
          padding: 10px 14px;
        }

        .reader-toolbar-actions {
          grid-column: 1 / -1;
          justify-content: flex-end;
        }

        .reader-toolbar h1 {
          font-size: 1.15rem;
        }

        .reader-content,
        .reader-footer {
          width: calc(100% - 28px);
        }

        .reader-content {
          margin-top: 14px;
          padding: 20px 16px;
        }

        .reader-button {
          min-height: 36px;
          padding: 0 10px;
        }

        #resources-panel {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav role="tablist" aria-label="Secondary display">
        <button
          id="resources-tab"
          class="tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="resources-panel"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="9" r="7"></circle>
            <path d="m12 6-1.9 4.1L6 12l1.9-4.1L12 6Z"></path>
          </svg>
          <span>Resources</span>
        </button>
        <button
          id="references-tab"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="references-panel"
          tabindex="-1"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 3.5h9a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2v-9Z"></path>
            <path d="M5 3.5v9a2 2 0 0 0 2 2M7 7h4M7 10h4"></path>
          </svg>
          <span>References</span>
        </button>
      </nav>
    </header>
    <main>
      <section id="resources-panel" role="tabpanel" aria-labelledby="resources-tab">
        <h1>Resources</h1>
        <p>Learning resources will be available here.</p>
      </section>
      <section id="references-panel" role="tabpanel" aria-labelledby="references-tab" hidden>
        <div id="reference-list-view" class="reference-list-view">
          <div class="list-heading">
            <h1>References</h1>
            <p>Choose a day to browse its reference material.</p>
          </div>
          <input
            id="reference-search"
            class="reference-search"
            type="search"
            aria-label="Search references"
            placeholder="Search subjects or days"
            autocomplete="off"
          />
          <div id="reference-list" aria-live="polite"></div>
        </div>
        <div id="reference-reader-view" hidden>
          <div id="reader-toolbar" class="reader-toolbar">
            <button id="reference-back" class="reader-button" type="button">Back to list</button>
            <h1 id="reference-title" tabindex="-1"></h1>
            <div class="reader-toolbar-actions">
              <button id="reference-previous" class="reader-button" type="button">Previous</button>
              <button id="reference-next" class="reader-button" type="button">Next</button>
            </div>
          </div>
          <div id="reference-content" class="reader-content"></div>
          <div class="reader-footer">
            <button id="reference-footer-previous" class="reader-button" type="button">
              Previous reference
            </button>
            <button id="reference-footer-next" class="reader-button" type="button">
              Next reference
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="./reference-data.js"></script>
    <script src="./overlay-references.js"></script>
  </body>
</html>

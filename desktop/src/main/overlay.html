<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinkup</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: light;
        --background: #f5f6fa;
        --surface: #ffffff;
        --panel: #f0f1f5;
        --text: #14162a;
        --text-secondary: #5b5d6e;
        --border: #e4e5ec;
        --accent: #6941c6;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #10131f;
        --surface: #181b28;
        --panel: #121420;
        --text: #e0e1f4;
        --text-secondary: #958ea0;
        --border: #2a2d3e;
        --accent: #b19aff;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--background);
        color: var(--text);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 72px;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
      }

      nav {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      button {
        font: inherit;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 150ms ease,
          color 150ms ease,
          border-color 150ms ease;
      }

      .tab:hover {
        color: var(--text);
      }

      .tab[aria-selected='true'] {
        background: var(--surface);
        border-color: var(--border);
        color: var(--accent);
        font-weight: 600;
      }

      .tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 32px;
        text-align: center;
      }

      section {
        max-width: 560px;
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 480px) {
        header {
          min-height: 64px;
          padding: 0 12px;
        }

        nav {
          width: 100%;
        }

        .tab {
          flex: 1;
          gap: 6px;
          padding: 0 10px;
        }

        main {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav role="tablist" aria-label="Secondary display">
        <button
          id="resources-tab"
          class="tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="resources-panel"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="9" r="7"></circle>
            <path d="m12 6-1.9 4.1L6 12l1.9-4.1L12 6Z"></path>
          </svg>
          <span>Resources</span>
        </button>
        <button
          id="references-tab"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="references-panel"
          tabindex="-1"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 3.5h9a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2v-9Z"></path>
            <path d="M5 3.5v9a2 2 0 0 0 2 2M7 7h4M7 10h4"></path>
          </svg>
          <span>References</span>
        </button>
      </nav>
    </header>
    <main>
      <section id="resources-panel" role="tabpanel" aria-labelledby="resources-tab">
        <h1>Resources</h1>
        <p>Learning resources will be available here.</p>
      </section>
      <section id="references-panel" role="tabpanel" aria-labelledby="references-tab" hidden>
        <h1>References</h1>
        <p>Learning references will be available here.</p>
      </section>
    </main>
    <script>
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panels = [...document.querySelectorAll('[role="tabpanel"]')];

      function selectTab(selectedTab, moveFocus = false) {
        for (const tab of tabs) {
          const isSelected = tab === selectedTab;
          tab.setAttribute('aria-selected', String(isSelected));
          tab.tabIndex = isSelected ? 0 : -1;
          if (isSelected) {
            const panel = document.getElementById(tab.getAttribute('aria-controls'));
            if (panel) panel.hidden = false;
          }
        }
        for (const panel of panels) {
          if (panel.id !== selectedTab.getAttribute('aria-controls')) panel.hidden = true;
        }
        if (moveFocus) selectedTab.focus();
      }

      for (const [index, tab] of tabs.entries()) {
        tab.addEventListener('click', () => selectTab(tab));
        tab.addEventListener('keydown', (event) => {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          const step = event.key === 'ArrowRight' ? 1 : -1;
          const nextTab = tabs[(index + step + tabs.length) % tabs.length];
          if (nextTab) selectTab(nextTab, true);
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return to Vinkup</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10131f;
        color: #cfd6ff;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        user-select: none;
      }

      .card {
        max-width: 520px;
        padding: 40px;
        border: 1px solid #2a3150;
        border-radius: 12px;
        background: #161b2e;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-weight: 500;
      }

      p {
        margin: 0 0 28px;
        color: #9aa4d6;
      }

      button {
        margin: 0 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }

      #back {
        background: #5b7cff;
        color: #fff;
      }

      #exit {
        background: #2a3150;
        color: #cfd6ff;
      }
    </style>
  </head>
  <body>
    <main class="card" role="dialog" aria-modal="true" aria-labelledby="alert-title">
      <h1 id="alert-title">You left the application</h1>
      <p>Go back to continue, or exit the app.</p>
      <button id="back" type="button">Go back to app</button>
      <button id="exit" type="button">Exit app</button>
    </main>
    <script>
      document.getElementById('back').addEventListener('click', () => {
        window.displayAlert.choose('back');
      });
      document.getElementById('exit').addEventListener('click', () => {
        window.displayAlert.choose('exit');
      });
    </script>
  </body>
</html>
